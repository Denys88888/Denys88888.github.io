<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#021F18" flood-opacity=".55"/></filter>
</defs>
<rect width="400" height="400" rx="90" fill="url(#bg)"/>
<rect width="400" height="400" rx="90" fill="url(#glow)"/>
