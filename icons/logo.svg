<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 400 400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A9A78"/><stop offset=".55" stop-color="#0F6E56"/><stop offset="1" stop-color="#073B2F"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".38" r=".55"><stop offset="0" stop-color="#3FE0AE" stop-opacity=".45"/><stop offset="1" stop-color="#3FE0AE" stop-opacity="0"/></radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE067"/><stop offset=".55" stop-color="#FFC21A"/><stop offset="1" stop-color="#E89A00"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFF5E4"/><stop offset="1" stop-color="#2C7E68"/></linearGradient>
