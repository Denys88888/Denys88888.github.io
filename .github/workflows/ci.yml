name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quality gate: type-check, unit tests (vitest), production build, and E2E
# tests must all pass before code reaches main.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://taxi-pro-server.onrender.com
          VITE_WS_URL: wss://taxi-pro-server.onrender.com

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    # No env pointing at production, and no servers started here. The suite
    # brings up its own backend (in-memory SQLite, sandbox Pi, three seconds)
    # and its own dev server pointed at it — see e2e/playwright.config.ts.
    #
    # Aiming it at the deployed API cost this job its meaning twice over. The
    # free Render instance hibernates, so the first test back wore a 502 and
    # reported it as an auth failure; the Cloudflare edge in front of it reads
    # a burst of logins from one address as a bot and answers with a challenge
    # page, on a runner as readily as on a laptop. Every run also wrote real
    # rides into the production store — and those piled up: once the server
    # started refusing a new ride to a passenger with an unpaid one, the
    # leftovers from previous runs blocked the suite outright.
    #
    # Starting a dev server here was worse than redundant: playwright reuses a
    # server already on the port, so its own correctly-configured one never
    # started and the app under test talked to production regardless.
    steps:
      - uses: actions/checkout@v4

      # The backend is a separate repository, and the suite needs it on disk to
      # start its own API. Without it e2e/helpers/env.ts finds no checkout and
      # falls back to the deployed API — which is the thing being got away from,
      # and is why dropping E2E_API_URL alone changed nothing. Public repo, so
      # no credentials are involved.
      - uses: actions/checkout@v4
        with:
          repository: Denys88888/taxi-pro-server
          path: taxi-pro-server

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: taxi-pro-server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
