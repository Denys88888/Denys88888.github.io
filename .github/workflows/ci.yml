name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quality gate: type-check, unit tests (vitest), production build, and E2E
# tests must all pass before code reaches main.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://taxi-pro-server.onrender.com
          VITE_WS_URL: wss://taxi-pro-server.onrender.com

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    # E2E runs UI against a local dev server pointed at PROD backend,
    # and API tests directly against the production API.
    # The backend repo is a separate repository — we don't clone it here.
    env:
      E2E_BASE_URL: http://localhost:5199
      E2E_API_URL: https://taxi-pro-server.onrender.com
      VITE_API_URL: https://taxi-pro-server.onrender.com
      VITE_WS_URL: wss://taxi-pro-server.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wake production backend
        # Render free tier sleeps after inactivity; one ping before tests start.
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://taxi-pro-server.onrender.com/api/health)
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 15
          done

      - name: Start frontend dev server
        run: npm run dev &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5199 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
