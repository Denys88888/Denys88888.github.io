name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quality gate: type-check, unit tests (vitest), production build, and E2E
# tests must all pass before code reaches main.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://taxi-pro-server.onrender.com
          VITE_WS_URL: wss://taxi-pro-server.onrender.com

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      E2E_BASE_URL: http://localhost:5199
      E2E_API_URL: http://localhost:3001
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        run: npm ci
        working-directory: ../taxi-pro-server
        # Skip if backend is not checked out alongside frontend in CI
        continue-on-error: true

      - name: Start backend (dev mode)
        run: |
          if [ -d "../taxi-pro-server" ]; then
            cd ../taxi-pro-server && npm run dev &
            echo "Backend started"
          fi
        continue-on-error: true

      - name: Start frontend dev server
        run: npm run dev &
        env:
          VITE_API_URL: http://localhost:3001
          VITE_WS_URL: ws://localhost:3001

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:5199 --timeout 30000
          npx wait-on http://localhost:3001/api/health --timeout 30000 || true

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
